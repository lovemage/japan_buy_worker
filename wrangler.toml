name = "japan-buy-workers"  # TODO: rename to "vovosnap-workers" when ready to deploy
main = "src/index.ts"
compatibility_date = "2026-03-13"
assets = { directory = "./public", binding = "ASSETS", run_worker_first = true }

routes = [
  { pattern = "vovosnap.com/*", zone_name = "vovosnap.com" },
  { pattern = "*.vovosnap.com/*", zone_name = "vovosnap.com" },
]

[vars]
CRAWL_LIST_PAGES = "100"
CRAWL_MAX_PAGES = "100"
CRAWL_TIMEOUT_MS = "120000"
APP_URL = "https://vovosnap.com"
MAIN_DOMAIN = "vovosnap.com"
SMS_RELAY_URL = "https://relay.vovosnap.com/send"
PAYUNI_SANDBOX = "1"  # 先走 sandbox 驗流程；切正式改 "0" 並換正式金鑰

# Secrets (set via: wrangler secret put <KEY>):
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# LINE_CHANNEL_ID
# LINE_CHANNEL_SECRET
# RESEND_API_KEY
# PLATFORM_ADMIN_PASSWORD
# EVERY8D_UID
# EVERY8D_PWD
# SMS_RELAY_URL (optional — relay URL when Cloudflare Worker → Every8D gets 403)
# SMS_RELAY_TOKEN (optional — Bearer token for relay auth)
# PAYUNI_MER_ID
# PAYUNI_HASH_KEY
# PAYUNI_HASH_IV

[[d1_databases]]
binding = "DB"
database_name = "japan_buy"
database_id = "35f83000-fddb-477c-9714-67aa1ba50864"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "japan-buy-images"
