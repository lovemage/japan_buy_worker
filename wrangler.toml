name = "japan-buy-workers"  # TODO: rename to "vovosnap-workers" when ready to deploy
main = "src/index.ts"
compatibility_date = "2026-03-13"
assets = { directory = "./public", binding = "ASSETS", run_worker_first = true }
send_email = [{ name = "EMAIL" }]

routes = [
  { pattern = "vovosnap.com/*", zone_name = "vovosnap.com" },
  { pattern = "*.vovosnap.com/*", zone_name = "vovosnap.com" },
]

[observability]
enabled = true

[triggers]
# 00:15 Asia/Taipei: downgrade expired paid plans and send renewal reminders.
# Monday 02:00 Asia/Taipei: weekly AI product compliance scan (MODERATION_SCAN_CRON in src/index.ts).
crons = ["15 16 * * *", "0 18 * * SUN"]

[vars]
CRAWL_LIST_PAGES = "100"
CRAWL_MAX_PAGES = "100"
CRAWL_TIMEOUT_MS = "120000"
APP_URL = "https://vovosnap.com"
MAIN_DOMAIN = "vovosnap.com"
PAYUNI_SANDBOX = "0"  # 正式環境（業主僅有正式金鑰；sandbox 需獨立測試商店帳號）

# Secrets (set via: wrangler secret put <KEY>):
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# LINE_CHANNEL_ID
# LINE_CHANNEL_SECRET
# RESEND_API_KEY
# PLATFORM_ADMIN_PASSWORD
# PAYUNI_MER_ID
# PAYUNI_HASH_KEY
# PAYUNI_HASH_IV

[[d1_databases]]
binding = "DB"
database_name = "japan_buy"
database_id = "35f83000-fddb-477c-9714-67aa1ba50864"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "japan-buy-images"
