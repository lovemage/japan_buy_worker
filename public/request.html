<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>訂單</title>
    <link rel="icon" type="image/png" href="/assets/images/logo-icon-64.png" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="/assets/templates.css" />
    <script>
    if (!window.__API_BASE) {
      var pm = location.pathname.match(/^(\/s\/[a-z0-9][a-z0-9-]*)/);
      if (pm) window.__API_BASE = pm[1];
    }
    if (!window.apiFetch) window.apiFetch = function(p, o) { return fetch((window.__API_BASE || '') + p, o); };
    document.addEventListener("DOMContentLoaded", function() {
      var base = window.__API_BASE || "";
      var back = document.getElementById("back-to-store");
      if (back) back.href = base + "/";
      var floatingBack = document.getElementById("floating-back-to-store");
      if (floatingBack) floatingBack.href = base + "/";
    });
    </script>
  </head>
  <body>
    <header class="page-header">
      <div class="container sub-header">
        <a class="sub-header__back" id="back-to-store" href="/store.html">← 返回商店</a>
        <img id="store-logo" class="sub-header__logo" style="display:none;" alt="商店 Logo" />
      </div>
    </header>
    <script>
    (function(){ var ds = window.__DISPLAY_SETTINGS || {}; if (ds.storeLogo) { var el = document.getElementById("store-logo"); if (el) { el.src = (window.__API_BASE || "") + "/api/images/" + ds.storeLogo; el.style.display = ""; } } })();
    </script>

    <main class="container">
      <section id="request-error" class="notice hidden" role="alert" aria-live="assertive"></section>

      <!-- Step indicator -->
      <ol class="request-steps" id="request-steps" aria-label="訂單流程">
        <li class="request-steps__item is-active" data-step="1"><span class="request-steps__num">1</span>檢視購物車</li>
        <li class="request-steps__item" data-step="2"><span class="request-steps__num">2</span>填寫資料</li>
      </ol>

      <section id="request-items" class="request-items" role="list" aria-label="訂單商品列表"></section>

      <!-- Step 1: review-only summary + next CTA -->
      <section id="cart-review" class="cart-review">
        <p class="meta cart-review__summary" id="cart-review-summary"></p>
        <button id="next-step-btn" class="button" type="button">下一步</button>
      </section>

      <form id="request-form" class="request-form" hidden>
        <button type="button" id="prev-step-btn" class="prev-step-btn" aria-label="返回購物車">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          返回購物車
        </button>
        <p class="trust-signal" aria-label="隱私保護說明">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>您的資料僅用於本次代購配送，不會用於其他用途
        </p>
        <fieldset id="shipping-options-box" class="shipping-options">
          <legend>配送方式</legend>
          <div id="shipping-options-list"></div>
          <div id="cvs-picker" class="cvs-picker" hidden>
            <p class="meta cvs-picker__hint">輸入店名、店號、路名或地址關鍵字，搜尋對應門市</p>
            <input id="cvs-search" type="text" class="input-cute" placeholder="例：信義門市、117290、忠孝東路" autocomplete="off" />
            <div id="cvs-picker-results" class="cvs-picker__results" hidden></div>
            <div id="cvs-picker-selected" class="cvs-picker__selected" hidden></div>
            <label class="cvs-picker__manual-note" for="cvs-manual-note">
              找不到指定門市？請自行填寫
              <textarea id="cvs-manual-note" rows="2" class="input-cute" placeholder="門市名稱、店號或地址"></textarea>
            </label>
            <p id="cvs-picker-status" class="meta cvs-picker__status"></p>
          </div>
          <p id="shipping-note" class="meta"></p>
        </fieldset>
        <label for="memberName">
          會員姓名
          <input id="memberName" name="memberName" type="text" class="input-cute" required aria-required="true" placeholder="收件人真實姓名" />
        </label>
        <div class="form-row-half">
          <label for="memberPhone">
            會員電話
            <input id="memberPhone" name="memberPhone" type="tel" class="input-cute" required aria-required="true" placeholder="09xx-xxx-xxx" />
          </label>
          <label for="lineId">
            Line ID
            <input id="lineId" name="lineId" type="text" class="input-cute" required aria-required="true" />
          </label>
        </div>
        <div id="recipient-address-fields">
          <label for="recipientCity">
            收件縣市
            <select id="recipientCity" name="recipientCity" class="input-cute" required aria-required="true"></select>
          </label>
          <label for="recipientAddress">
            收件地址
            <input id="recipientAddress" name="recipientAddress" type="text" class="input-cute" required aria-required="true" placeholder="街道路名、門牌號碼、樓層" />
          </label>
        </div>
        <label>
          訂單備註（選填）
          <textarea id="notes" name="notes" rows="3" class="input-cute"></textarea>
        </label>
        <div class="captcha-box">
          <p class="meta">請輸入圖中英數字</p>
          <svg id="captcha-svg" class="captcha-svg" viewBox="0 0 110 50" role="img" aria-label="圖形驗證碼，請看圖片輸入英數字"></svg>
          <label for="captchaInput" class="sr-only">驗證碼</label>
          <div class="captcha-row">
            <input id="captchaInput" name="captchaInput" type="text" class="input-cute" placeholder="輸入驗證碼" required autocomplete="off" aria-required="true" />
            <button id="captcha-refresh" class="captcha-refresh-btn" type="button" aria-label="重新產生驗證碼" title="重新產生驗證碼">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
              </svg>
            </button>
          </div>
        </div>
        <section class="request-total-box">
          <p class="meta" id="shipping-twd">運費：NT$0</p>
          <p class="meta" id="total-jpy">商品合計：&yen;0 / NT$0</p>
          <p id="total-twd" class="request-total-highlight">合計：NT$0</p>
        </section>
        <button id="submit-btn" class="btn-pill" type="submit">送出訂單</button>
      </form>
    </main>

    <a class="floating-back-btn" id="floating-back-to-store" href="/store.html" aria-label="上一頁">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="24" height="24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12.5 9.75A2.75 2.75 0 0 0 9.75 7H4.56l2.22 2.22a.75.75 0 1 1-1.06 1.06l-3.5-3.5a.75.75 0 0 1 0-1.06l3.5-3.5a.75.75 0 0 1 1.06 1.06L4.56 5.5h5.19a4.25 4.25 0 0 1 0 8.5h-1a.75.75 0 0 1 0-1.5h1a2.75 2.75 0 0 0 2.75-2.75" clip-rule="evenodd"/></svg>
    </a>

    <script type="module" src="/assets/app-request.js"></script>
  </body>
</html>
